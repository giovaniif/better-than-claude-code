# Builds the web image (Dockerfile) and pushes it to
# ghcr.io/giovaniif/switchyard: `latest` from main, the version (`0.1.0`) from
# a release tag, and the short sha on every build. docker-compose.yml pulls
# `latest`.
name: Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "design/**", "**.md"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/giovaniif/switchyard

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: tags
        run: |
          sha="$(git rev-parse --short HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          tags="$IMAGE:$sha"
          case "$GITHUB_REF" in
            refs/heads/main) tags="$tags,$IMAGE:latest" ;;
            refs/tags/v*) tags="$tags,$IMAGE:${GITHUB_REF#refs/tags/v}" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            YARD_BUILD_ID=${{ steps.tags.outputs.sha }}
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Switchyard
          cache-from: type=gha
          cache-to: type=gha,mode=max
